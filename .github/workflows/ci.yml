name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # Dépendances d'exécution nécessaires aux tests (l'installation du paquet
          # via pyproject sera activée quand le backend de build sera figé).
          pip install ruff pytest requests pandas pyarrow

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests unitaires (pytest)
        run: pytest -q

      # Étapes à activer aux phases suivantes (Plan Technique §53) :
      # - data tests (dbt tests + Pandera)  → Phase 4
      # - integration tests                 → Phase 8
      # - build frontend (Next.js)          → Phase 9
