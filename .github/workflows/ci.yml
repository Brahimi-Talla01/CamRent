name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    # Service PostgreSQL : permet d'exécuter les **tests de données** (`dbt build`,
    # 16 modèles + 121 tests) en CI, conformément au lot C du plan de réalignement
    # (§7.10 / §8.2, décision 8). La CI ne se contente plus de valider le lint et
    # les tests unitaires : elle vérifie aussi les invariants de données.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: camrent
          # Mot de passe de service éphémère : aucun secret réel dans le dépôt (AGENTS.md §9).
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: camrent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Racine de données dédiée à la CI
        # Définie en GITHUB_ENV (et non en env de job) : le contexte `runner`
        # n'est pas lisible au niveau job. Le jeu synthétique n'atteint jamais
        # `data/` du projet (ignoré par git, mais jamais écrasable : cf. le refus
        # intégré au générateur).
        run: echo "CAMRENT_DATA_ROOT=$RUNNER_TEMP/camrent-ci-data" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Fichier de dépendances explicite : le dépôt n'a pas de requirements.txt.
          cache-dependency-path: pyproject.toml

      - name: Install package (backend de build figé)
        run: |
          python -m pip install --upgrade pip
          # Le paquet est installable depuis `pyproject.toml` (lot C) : les extras
          # regroupent l'outillage (ruff, pytest, httpx), les transformations dbt
          # (dbt-postgres), le ML (scikit-learn, lightgbm, mlflow-skinny, alembic,
          # skops) et l'API publique (fastapi, uvicorn) — mêmes dépendances
          # qu'auparavant, déclarées une seule fois. L'extra `api` est requis depuis
          # le ticket #50 (API publique FastAPI) et `internal` depuis le ticket #61
          # (API interne Django) : sans eux, les tests correspondants échoueraient.
          pip install -e '.[dev,transform,ml,api,internal]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests unitaires (pytest)
        # Les tests d'intégration exigent une base construite par dbt : ils sont
        # exécutés après `dbt build`, dans une étape dédiée. Les exclure ici évite
        # un « skip » silencieux qui laisserait croire qu'ils ont tourné.
        run: pytest -q --ignore=tests/integration

      # --- API interne (ticket #61) ------------------------------------
      # Les tests unitaires de l'API interne tournent sur SQLite en mémoire ; cette
      # étape vérifie en plus que les migrations s'appliquent sur **PostgreSQL**
      # (le moteur réel) et qu'aucune modification de modèle n'attend sa migration.
      - name: Migrations de l'API interne (PostgreSQL)
        env:
          # Clé de CI éphémère : aucun secret réel dans le dépôt (AGENTS.md §9).
          INTERNAL_SECRET_KEY: ci-only-secret-key-not-a-real-secret-0123456789abcdef
          DATABASE_URL: postgresql://camrent:change-me@localhost:5432/camrent_ci
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      # --- Tests de données (lot C) ------------------------------------
      # Aucune donnée réelle n'est versionnable : `data/raw/`, `data/processed/`
      # et `data/samples/` sont ignorés, et le jeu local est un dépôt tiers sans
      # licence (redistribution interdite). La CI fabrique donc un jeu
      # synthétique déterministe et le fait passer par la chaîne réelle.
      - name: Jeu de données synthétique
        run: python -m tests.data.make_synthetic_dataset --data-root "$CAMRENT_DATA_ROOT"

      - name: Chargement dans PostgreSQL (landing)
        env:
          DATABASE_URL: postgresql://camrent:change-me@localhost:5432/camrent_ci
        run: python -m pipelines load

      - name: Tests de données (dbt build)
        env:
          DBT_TARGET: dev
          DBT_HOST: localhost
          DBT_PORT: "5432"
          DBT_USER: camrent
          DBT_PASSWORD: change-me
          DBT_DBNAME: camrent_ci
          # Schéma dédié à la CI : l'exercice du levier `DBT_SCHEMA_DEV` (séparation
          # dev / prod du lot C) est vérifié à chaque exécution.
          DBT_SCHEMA_DEV: analytics_ci
        run: cd dbt && dbt build --no-version-check

      - name: Tests d'intégration API (marts réels)
        # Compare les endpoints de marché et de comparaison aux marts construits
        # juste au-dessus, dans le schéma dédié à la CI. Aucun chiffre n'est figé :
        # les tests relisent les marts et vérifient que l'API renvoie les mêmes
        # valeurs, N, seuil et estimations compris (tickets #53 et #54).
        env:
          DATABASE_URL: postgresql://camrent:change-me@localhost:5432/camrent_ci
          DBT_MARTS_SCHEMA: analytics_ci_marts
        run: pytest -q tests/integration

      # Étapes restant à activer aux phases suivantes (Plan Technique §53) :
      # - contrôles Pandera sur le Silver → option du Plan §26, non retenue au MVP
      #   (les tests dbt couvrent les marts) ;
      # - integration tests  → ticket #60 (API → base → modèle, parcours de bout en
      #   bout) ; le socle de l'API (#50) et l'API interne (#61) sont couverts par
      #   les tests unitaires et l'étape de migrations ci-dessus ;
      # - build frontend (Next.js) → livré : voir le job `frontend` ci-dessous ;
      # - déploiement → Phase 12 (voir `cd.yml`).

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    # Le frontend public (Phase 9a) a sa propre chaîne : lint, typage, tests
    # unitaires du client API et build de production. Il ne dépend pas de
    # PostgreSQL ni des marts : ces écrans-là viendront avec 09a.2 à 09a.4.
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (lockfile)
        # `npm ci` exige un `package-lock.json` versionné : les versions sont
        # figées, une installation locale et la CI résolvent les mêmes paquets.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitaires (client API)
        run: npm test

      - name: Build
        env:
          # Valeur de build **non secrète** : le client API est inliné au build.
          # L'application ne contacte aucune API pendant la compilation.
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build
