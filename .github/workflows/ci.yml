name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # Dépendances d'exécution nécessaires aux tests : `sqlalchemy` est requise
          # par le chargeur Silver → PostgreSQL (Phase 4), `scikit-learn` par les
          # métriques des baselines ML (Phase 5). Les deux sont testées avec des
          # moteurs/données simulés (aucune base requise en CI).
          # (l'installation du paquet via pyproject sera activée quand le backend de
          # build sera figé).
          pip install ruff pytest requests pandas pyarrow sqlalchemy scikit-learn

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests unitaires (pytest)
        run: pytest -q

      # Étapes à activer aux phases suivantes (Plan Technique §53) :
      # - data tests dbt (`dbt build`)      → nécessitent PostgreSQL, exécutés
      #   hors CI au MVP (Phase 10 — orchestration) ; la CI ne valide que le
      #   lint et les tests unitaires.
      # - contrôles Pandera sur le Silver    → option du Plan §26, non retenue
      #   au MVP (les tests dbt couvrent les marts).
      # - integration tests                 → Phase 8
      # - build frontend (Next.js)          → Phase 9
