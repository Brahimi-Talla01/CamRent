version: 2

models:
  - name: dim_city
    description: >
      Dimension villes : une ligne par ville canonique. `n_observations`
      indique le volume Silver sous-jacent (invariant 8).
    columns:
      - name: city_name
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['Douala', 'Yaoundé']
      - name: n_observations
        tests:
          - not_null

  - name: dim_neighborhood
    description: >
      Dimension quartiers : une ligne par (ville, quartier) tel qu'observé.
      `is_canonical` signale les libellés reconnus par le référentiel seed
      (issue #20) ; les libellés non reconnus restent listés, jamais mappés.
    columns:
      - name: city_name
        tests:
          - not_null
      - name: neighborhood_name
        tests:
          - not_null
      - name: is_canonical
        tests:
          - not_null

  - name: dim_property_type
    description: >
      Dimension types de logement : une ligne par type canonique.
    columns:
      - name: property_type_name
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['studio', 'apartment', 'house', 'office', 'shop', 'warehouse', 'room', 'land']
      - name: n_observations
        tests:
          - not_null

  - name: dim_date
    description: >
      Dimension dates : une ligne par date observée (publication ou collecte).
      Construite depuis les données réelles, pas de calendrier artificiel.
    columns:
      - name: date_day
        tests:
          - unique
          - not_null
      - name: year
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 2000
                max_value: 2100
      - name: month
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 1
                max_value: 12
      - name: day
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 1
                max_value: 31

  - name: fct_rent_observations
    description: >
      Fait des observations : une ligne par observation Silver. Toute
      statistique de marché dérive de ce fait (charte de grain unique).
    columns:
      - name: listing_key
        tests:
          - unique
          - not_null
      - name: city_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_city')
                field: city_name
      # Clé composite (ville | quartier) : la paire est contrôlée par le test
      # singulier `assert_neighborhood_key_exists_in_dim_neighborhood`.
      - name: neighborhood_key
        tests:
          - not_null
      - name: property_type_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_property_type')
                field: property_type_name
      - name: date_day
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: rent_price
        tests:
          - not_null
          # Bornes inclusives : le prix doit être strictement positif. Les
          # valeurs extrêmes mais conservées (1 FCFA, 40 000 000 FCFA) restent
          # valides au sens de la borne — elles sont signalées par
          # `outlier_flags`, jamais supprimées.
          - within_range:
              arguments:
                min_value: 1
      - name: bedrooms
        tests:
          - within_range:
              arguments:
                min_value: 0
                max_value: 10
      # Bornes de pièces : la borne supérieure n'est **pas** un filtre — une
      # valeur hors bornes plausibles (ex. `bathrooms = 80`, 3 observations
      # réelles) est conservée et signalée dans `outlier_flags`. Le contrôle du
      # signalement est porté par le test singulier
      # `assert_implausible_rooms_are_signalled` (var `rooms_max_plausible`).
      - name: bathrooms
        tests:
          - within_range:
              arguments:
                min_value: 0

  - name: fct_listings
    description: >
      Fait des annonces : grain identique à fct_rent_observations, colonnes
      source conservées pour la traçabilité (Plan Technique §29).
    columns:
      - name: listing_key
        tests:
          - unique
          - not_null
      - name: source_listing_id
        tests:
          - not_null

  - name: mart_neighborhood_prices
    description: >
      Stats de marché par (ville, quartier, type, chambres). Grain : une
      ligne par combinaison. `median_rent_price` est null sous le seuil de
      publication (var min_publish_n), N affiché en toutes circonstances
      (invariant 8).
    columns:
      - name: city
        tests:
          - not_null
      - name: neighborhood
        tests:
          - not_null
      - name: property_type
        tests:
          - not_null
      - name: n_observations
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 1
      - name: mean_rent_price
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
      # La médiane peut être nulle sous le seuil de publication : la borne
      # inférieure suffit (le contrôle du seuil est le test singulier).
      - name: median_rent_price
        tests:
          - within_range:
              arguments:
                min_value: 0
      # Qualité visible, jamais masquée (invariant 8) : volumes et parts.
      - name: n_price_bound
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
      - name: pct_price_bound
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: n_republication
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
      - name: pct_republication
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_city_prices
    description: >
      Stats de marché par ville. N d'observations toujours présent.
    columns:
      - name: city
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['Douala', 'Yaoundé']
      - name: n_observations
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 1
      - name: median_rent_price
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
      - name: n_price_bound
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
      - name: pct_price_bound
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: n_republication
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
      - name: pct_republication
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: n_neighborhood_unrecognized
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
      - name: pct_neighborhood_unrecognized
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_property_prices
    description: >
      Stats de marché par (type, ville). N d'observations toujours présent.
    columns:
      - name: property_type
        tests:
          - not_null
      - name: city
        tests:
          - not_null
      - name: n_observations
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 1
      - name: median_rent_price
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
      - name: p10_rent_price
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
      - name: p90_rent_price
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
      - name: n_price_bound
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
      - name: pct_price_bound
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: n_republication
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
      - name: pct_republication
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_data_quality
    description: >
      Motifs de rejet agrégés par source (lot B). Grain : une ligne par
      (source, motif). Chaque ligne porte son nombre de rejets et le total des
      rejets de la source : jamais un pourcentage sans son volume (invariant 8).
      Aucun rejet n'est masqué (invariant 5).
    columns:
      - name: source_name
        tests:
          - not_null
      - name: quarantine_reason
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['prix_manquant', 'type_inconnu', 'city_inconnue', 'prix_invalide']
      # Le nombre de rejets n'est pas unique par nature : l'unicité du grain
      # (source, motif) est portée par le test singulier
      # `assert_data_quality_grain_is_unique`.
      - name: n_rejections
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 1
      - name: n_rejections_source
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 1
      - name: pct_of_source_rejections
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_ingestion_lots
    description: >
      Lots de collecte et leur provenance (lot B). Grain : une ligne par lot
      brut. Une seule ligne est unique par `raw_file` ; `has_provenance` est
      faux pour les lots antérieurs à la version du connecteur et à l'empreinte
      de contenu — l'absence est signalée, pas inventée.
    columns:
      - name: raw_file
        tests:
          - unique
          - not_null
      - name: source_name
        tests:
          - not_null
      - name: record_count
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0
      - name: lot_validation_status
        tests:
          - accepted_values:
              arguments:
                values: ['ok', 'failed', 'unreadable']
      - name: has_provenance
        tests:
          - not_null

  - name: mart_ml_dataset
    description: >
      Dataset ML : features du MVP + cible `target_rent_price` + sémantique
      explicite de la cible (`rent_semantics`). Sans `rent_per_m2` (data
      leakage) ; drapeaux qualité exposés pour pondération/exclusion explicite
      en Phase 5-6.
    columns:
      - name: listing_key
        tests:
          - unique
          - not_null
      - name: rent_semantics
        description: >
          Sémantique de la cible : `asking_rent` (loyer demandé dans l'annonce)
          ou `unknown` (sémantique non établie). La cible `target_rent_price`
          n'est pas renommée.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['asking_rent', 'unknown']
      - name: city
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Douala', 'Yaoundé']
      - name: neighborhood
        tests:
          - not_null
      - name: property_type
        tests:
          - not_null
      - name: target_rent_price
        tests:
          - not_null
          - within_range:
              arguments:
                min_value: 1
