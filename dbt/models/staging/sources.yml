version: 2

# Tables d'atterrissage dans le schéma `landing` : copies des artefacts de la
# Data Platform, chargées par `python -m pipelines load` (pipelines/db.py).
# Les données brutes restent dans `data/raw/` (immuables) et le Silver dans
# `data/processed/` ; ces tables sont des copies dérivées, rejouables à tout
# moment (vidage puis insertion, jamais de DROP).

sources:
  - name: landing
    description: >
      Atterrissage de la Data Platform dans PostgreSQL : Silver nettoyé,
      quarantaine de la Phase 2 et métadonnées de collecte.
      Chargé par `python -m pipelines load`.
    schema: landing
    tables:
      - name: silver_listings
        description: >
          Grain : une ligne par annonce nettoyée (après dédup technique et
          validation de la Phase 2). 2 992 lignes attendues au dernier rejeu.
        columns:
          - name: source_listing_id
            description: Identifiant de l'annonce chez la source d'origine.
            tests:
              - not_null
          - name: source
            tests:
              - not_null
          - name: rent_price
            tests:
              - not_null

      - name: quarantine_listings
        description: >
          Observations rejetées par la Phase 2 (jamais supprimées), avec leur
          motif. Grain : une ligne par observation rejetée, une ligne par ligne
          de quarantine_listings.parquet. 78 lignes attendues au dernier rejeu.
        columns:
          - name: quarantine_reason
            description: Motif du rejet (prix_manquant, type_inconnu, city_inconnue, prix_invalide).
            tests:
              - not_null
          - name: source
            tests:
              - not_null

      - name: ingestion_runs
        description: >
          Métadonnées de collecte : une ligne par lot brut (data/raw/metadata).
          Depuis la provenance renforcée (lot B), chaque nouveau lot porte la
          version du connecteur, l'empreinte SHA-256 de son contenu et le statut
          de ses validations Bronze ; les lots antérieurs n'ont pas ces champs.
        columns:
          - name: raw_file
            description: Chemin du fichier brut relatif à data/raw/.
            tests:
              - not_null
          - name: source
            tests:
              - not_null
