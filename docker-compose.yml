# Services locaux du MVP.
# Principe (Plan Technique §56/§72) : n'ajouter un service que lorsqu'il répond à un besoin réel.
# Les autres services (minio, airflow, redis, backend, frontend) seront ajoutés à leur phase.

name: camrent

services:
  postgres:
    image: postgres:16-alpine
    container_name: camrent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-camrent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-camrent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-camrent} -d ${POSTGRES_DB:-camrent}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
