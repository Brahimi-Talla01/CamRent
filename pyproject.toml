# Configuration Python de CamRent.
#
# Backend de build **figé** (lot C, plan §7.10 / §8.2) : le paquet est
# installable, ce qui permet à la CI d'installer le projet au lieu d'empiler des
# `pip install` de dépendances manuelles.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camrent"
version = "0.1.0"
description = "Analyse et estimation des loyers au Cameroun (Yaoundé & Douala)"
requires-python = ">=3.11"

# Socle commun : manipulation de données + accès PostgreSQL (MVP, Plan Technique §57/§73)
dependencies = [
    "pandas",
    "pyarrow",
    "SQLAlchemy",
    "psycopg[binary]",
    "requests",
]

[project.optional-dependencies]
# Phase 4 : transformations SQL versionnées (dbt-core + adaptateur PostgreSQL).
# Installez via : pip install -e '.[transform]'
transform = [
    "dbt-postgres",
]
ml = [
    "scikit-learn",
    # Phase 6 : modèle d'ensemble (comparé aux familles scikit-learn)
    "lightgbm",
    # Phase 7 : suivi MLflow et Model Registry. `mlflow-skinny` suffit (suivi +
    # registre + flavors) sans le serveur/UI ni `pyarrow` du paquet complet ; il
    # faut ajouter `alembic` (store SQLAlchemy) et `skops` (sérialisation sklearn).
    "mlflow-skinny",
    "alembic",
    "skops",
]
api = [
    "fastapi",
    "uvicorn[standard]",
]
# Phase 8b : API **interne** du back-office (ticket #61). Django reste séparé de
# l'API publique FastAPI : deux applications, deux contrôles d'accès, aucun
# couplage. Django >= 6 est requis pour Python 3.12+ (dont 3.14, version locale).
internal = [
    "django>=6.0",
]
quality = [
    "pandera",
]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    # Phase 8 : `fastapi.testclient.TestClient` s'appuie sur `httpx`. Dépendance de
    # test uniquement — le service lui-même n'en a pas besoin.
    "httpx",
    # Phase 8b : base de test de Django (création/flush de la base de test,
    # client HTTP, marqueur `django_db`) pour l'API interne.
    "pytest-django",
]

[tool.setuptools]
# Layout plat : l'auto-discovery de setuptools refuse plusieurs paquets de
# premier niveau (« flat-layout »), on les déclare explicitement.
# - `eda/` n'a pas d'`__init__.py` : ce sont des scripts exécutés depuis la
#   racine (`python eda/...`), pas un paquet — hors installation.
# - `tests/`, `docs/` et `assets/` ne sont pas des paquets d'exécution.
packages = [
    "ingestion",
    "ingestion.sources",
    "pipelines",
    "ml",
    "ml.src",
    # Phase 8 : API publique (sous-systèmes Estimation et Back-office).
    "backend",
    "backend.api",
    "backend.api.routes",
    "backend.domain",
    "backend.infrastructure",
    "backend.ml",
    "backend.repositories",
    "backend.schemas",
    "backend.services",
    # Phase 8b : API interne (Django), application distincte du public.
    "backend.internal",
    "backend.internal.accounts",
    "backend.internal.accounts.management",
    "backend.internal.accounts.management.commands",
    "backend.internal.accounts.migrations",
    "backend.internal.audit",
    "backend.internal.audit.migrations",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# `inspire/` et `assets/` sont du matériel de référence, pas du code du projet.
# Les migrations Django sont **générées** par `makemigrations` : les relinter
# reviendrait à modifier du code généré (AGENTS.md §3).
extend-exclude = ["inspire", "assets", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Phase 8b : l'API interne est une application Django. Les tests utilisent le
# module de réglages **de test** (SQLite en mémoire, clé factice) : la suite reste
# exécutable sans PostgreSQL, comme le reste des tests unitaires.
DJANGO_SETTINGS_MODULE = "backend.internal.settings_test"
# Permet `import ingestion` (pas de layout src/) quand pytest tourne depuis la racine.
pythonpath = ["."]
